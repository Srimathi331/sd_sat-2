apiVersion: v1
kind: ConfigMap
metadata: { name: news-config }
data:
  KAFKA_BROKERS: kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092
  KAFKA_REPLICATION: "3"
  REDIS_URL: redis://redis-cluster:6379
  POSTGRES_HOST: postgres-primary
  MONGO_URL: mongodb://mongo-0,mongo-1,mongo-2/?replicaSet=rs0
  USER_SERVICE_URL: http://user-service:4001
  TOPIC_SERVICE_URL: http://topic-service:4002
  ARTICLE_SERVICE_URL: http://article-service:4003
  FEED_SERVICE_URL: http://feed-service:4004
  NOTIFICATION_SERVICE_URL: http://notification-service:4005
---
apiVersion: v1
kind: Secret
metadata: { name: news-secrets }
stringData: { JWT_SECRET: change-me, INTERNAL_TOKEN: change-me, POSTGRES_USER: news, POSTGRES_PASSWORD: change-me }
