apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, labels: { app: notification-service } }
spec:
  replicas: 3
  selector: { matchLabels: { app: notification-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 } }   # zero-downtime deploys
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: registry.example.com/news/notification-service:latest
          ports: [{ containerPort: 4005 }]
          envFrom: [{ configMapRef: { name: news-config } }, { secretRef: { name: news-secrets } }]
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          livenessProbe:  { httpGet: { path: /health, port: 4005 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready,  port: 4005 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service }
spec: { selector: { app: notification-service }, ports: [{ port: 4005, targetPort: 4005 }] }
---
# Horizontal Pod Autoscaler: add pods when CPU > 60%. Scale up fast, scale down slowly (spikes come in waves).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: notification-service }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: notification-service }
  minReplicas: 3
  maxReplicas: 60
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
  behavior:
    scaleUp:   { stabilizationWindowSeconds: 0,   policies: [{ type: Percent, value: 100, periodSeconds: 15 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 20,  periodSeconds: 60 }] }
