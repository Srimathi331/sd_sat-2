# Scale notification delivery workers on Kafka consumer LAG (not CPU): lag = "how far behind are we".
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: notification-service-lag }
spec:
  scaleTargetRef: { name: notification-service }
  minReplicaCount: 3
  maxReplicaCount: 48            # no point exceeding #partitions of notification.requested
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: notification.delivery
        topic: notification.requested
        lagThreshold: "500"
