apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, labels: { app: api-gateway } }
spec:
  replicas: 3
  selector: { matchLabels: { app: api-gateway } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 } }   # zero-downtime deploys
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: registry.example.com/news/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: news-config } }, { secretRef: { name: news-secrets } }]
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          livenessProbe:  { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready,  port: 8080 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec: { selector: { app: api-gateway }, ports: [{ port: 8080, targetPort: 8080 }] }
---
# Horizontal Pod Autoscaler: add pods when CPU > 60%. Scale up fast, scale down slowly (spikes come in waves).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 3
  maxReplicas: 50
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
  behavior:
    scaleUp:   { stabilizationWindowSeconds: 0,   policies: [{ type: Percent, value: 100, periodSeconds: 15 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 20,  periodSeconds: 60 }] }
